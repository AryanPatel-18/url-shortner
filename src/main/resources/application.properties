spring.application.name=url-shortner

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?options=-c%20TimeZone=UTC
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=default
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.endpoint.jackson.Jackson2EndpointAutoConfiguration
management.endpoints.web.exposure.include=health,metrics

api.version=v1

rate-limit.policies.create.capacity=10
rate-limit.policies.create.refill-interval=6
rate-limit.policies.update.capacity=30
rate-limit.policies.update.refill-interval=2
rate-limit.policies.delete.capacity=30
rate-limit.policies.delete.refill-interval=2
rate-limit.policies.list.capacity=60
rate-limit.policies.list.refill-interval=1
rate-limit.policies.get.capacity=60
rate-limit.policies.get.refill-interval=1